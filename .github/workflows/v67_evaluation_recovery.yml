name: V67 frozen evaluation recovery without retraining
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  evaluation-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WENGUA_APP_ROOT: ${{ github.workspace }}/.legacy_app
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: turnupmason/WenguaApp
          ref: b41d335e00fd75a294e195c1cabad85331d9baa2
          path: .legacy_app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - name: Preserve trained weights and answer bytes, resume own-history across fresh processes
        run: python -m wengua_recovery.check_v67_evaluation
