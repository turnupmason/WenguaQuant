name: V65 matched initializations, numerical parity and exact resume fixtures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  matched-training:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WENGUA_APP_ROOT: ${{ github.workspace }}/.legacy_app
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: turnupmason/WenguaApp
          ref: b41d335e00fd75a294e195c1cabad85331d9baa2
          path: .legacy_app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1
      - name: Actual tiny Qwen, both initializations, cached logits, exact optimizer and RNG resume, all epoch answers and native Windows CMD help
        run: python -m wengua_course_v65.check_training
